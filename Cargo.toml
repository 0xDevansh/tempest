[package]
name = "tempest"
version = "0.1.0"
edition = "2024"

[lib]
name = "tempest"
path = "src/lib/mod.rs"

[[bin]]
name = "tempest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bstr = "1.12.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
url = "2"
